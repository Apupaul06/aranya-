<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARANYA — Tree Record</title>
<meta name="description" content="Project ARANYA digital herbarium — tree record">
<style>
  :root{
    --bark:#2f2a24; --leaf:#1f5132; --leaf-2:#2d7a4b; --moss:#6b8f5e;
    --paper:#f7f5ef; --card:#ffffff; --line:#e3ded2; --muted:#6c6459;
    --accent:#c2772c;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--paper); color:var(--bark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
  header{
    background:var(--leaf); color:#fff; padding:18px 16px 16px;
    padding-top:calc(18px + env(safe-area-inset-top));
  }
  header .inner{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .mark{
    width:38px;height:38px;flex:0 0 38px;border-radius:50%;
    background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:20px
  }

  .orglogo{height:54px;width:auto;max-width:170px;object-fit:contain;flex:0 0 auto;opacity:.95}
  @media (max-width:430px){ .orglogo{height:42px;max-width:124px} }
  .footlogo{display:block;margin:0 auto 14px;height:112px;width:auto;opacity:.9}
  .mark img{width:100%;height:100%;object-fit:contain;border-radius:50%}
  .brand{font-weight:700;letter-spacing:.14em;font-size:15px}
  .brand small{display:block;font-weight:400;letter-spacing:.02em;font-size:11px;opacity:.85}

  .state{padding:48px 20px;text-align:center;color:var(--muted)}
  .spinner{
    width:28px;height:28px;margin:0 auto 14px;border:3px solid var(--line);
    border-top-color:var(--leaf-2);border-radius:50%;animation:spin .8s linear infinite
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-top:16px;overflow:hidden
  }
  .hero{padding:20px 18px 16px;border-bottom:1px solid var(--line)}
  .idtag{
    display:inline-block;font-size:11px;letter-spacing:.1em;font-weight:600;
    color:var(--leaf);background:#e8f0e7;border-radius:999px;padding:4px 11px;margin-bottom:12px
  }
  h1{margin:0;font-size:30px;line-height:1.15;font-weight:700}
  .h-sub{margin:4px 0 0;font-size:19px;color:var(--bark);opacity:.8}
  .sci{margin:10px 0 0;font-style:italic;font-size:15px;color:var(--leaf-2);font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{
    font-size:12px;padding:4px 10px;border-radius:6px;
    background:#f1efe8;color:var(--muted);border:1px solid var(--line)
  }
  .chip.on{background:#eef5ec;color:var(--leaf);border-color:#cfe2cc}

  figure{margin:0;background:#efece3}
  figure img{display:block;width:100%;height:auto}
  .gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;
       -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .gal::-webkit-scrollbar{display:none}
  .gal img{flex:0 0 100%;scroll-snap-align:center;display:block;width:100%;height:auto}
  .dots{display:flex;justify-content:center;gap:6px;padding:9px 0 3px;background:#efece3}
  .dots i{width:6px;height:6px;border-radius:50%;background:#c3bdb0;display:block}
  .dots i.on{background:var(--leaf)}

  .qr{padding:18px;border-top:1px solid var(--line);text-align:center}
  .qr b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
        color:var(--muted);margin-bottom:12px;font-weight:600}
  .qr img{width:170px;height:170px;background:#fff;padding:9px;border-radius:10px;border:1px solid var(--line)}
  .qr .dl{display:inline-block;margin-top:12px;font-size:13.5px;font-weight:600;
          color:var(--leaf-2);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}

  dl{margin:0;padding:6px 18px 14px}
  .row{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid #f0ece2}
  .row:last-child{border-bottom:0}
  dt{flex:0 0 40%;margin:0;font-size:13px;color:var(--muted)}
  dd{flex:1;margin:0;font-size:15px;font-weight:500;word-break:break-word}
  dd a{color:var(--leaf-2)}

  .notes{padding:14px 18px;background:#faf8f2;border-top:1px solid var(--line);font-size:14px;color:#4a443c}
  .notes b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:600}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .btn{
    display:block;text-align:center;text-decoration:none;font-size:14px;font-weight:600;
    padding:13px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--bark)
  }
  .btn.primary{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .btn.full{grid-column:1 / -1}

  .report{
    margin-top:20px;padding:15px 16px;border:1px dashed #d8d2c4;border-radius:12px;
    font-size:13px;color:var(--muted);background:#fbfaf6
  }
  .report b{color:var(--bark)}
  .report a{color:var(--leaf-2)}

  footer{margin-top:26px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
  footer a{color:var(--muted)}
  .picker{margin-top:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfaf6}
  .picker b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:600}
  .picker .pills{display:flex;flex-wrap:wrap;gap:7px}
  .picker a{
    text-decoration:none;font-size:13px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--bark)
  }
  .picker a.cur{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .banner{
    margin-top:14px;padding:10px 13px;border-radius:9px;font-size:12.5px;
    background:#fdf4e6;border:1px solid #f0dcbd;color:#7a5618
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#15181a; --card:#1d2124; --line:#2e3438; --bark:#e8e6e1;
      --muted:#9aa09f; --leaf:#1b4a2e;
    }
    .idtag{background:#1f3326;color:#8fd0a3}
    .chip{background:#242a2d}
    .chip.on{background:#1f3326;color:#8fd0a3;border-color:#2c4a36}
    .notes{background:#191d20;color:#c9c6c0}
    .report{background:#191d20;border-color:#333a3e}
    .btn{background:#242a2d;color:var(--bark)}
    figure{background:#242a2d}
    .dots{background:#242a2d}
    .qr img{background:#fff}
    .footlogo{filter:brightness(0) invert(1);opacity:.7}
    .picker{margin-top:16px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fbfaf6}
  .picker b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:600}
  .picker .pills{display:flex;flex-wrap:wrap;gap:7px}
  .picker a{
    text-decoration:none;font-size:13px;padding:7px 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--bark)
  }
  .picker a.cur{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .banner{background:#2a2113;border-color:#4a3c20;color:#e0bd7f}
  }
</style>
</head>
<body>

<header>
  <div class="inner" style="justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <div class="mark"><img src="aranya-logo.png" data-optional data-alt="photos/aranya-logo.png" alt=""></div>
      <div class="brand">ARANYA<small>LIVE Foundation · Digital Herbarium</small></div>
    </div>
    <img class="orglogo" src="logo.png" data-optional data-alt="photos/logo.png" alt="LIVE Foundation">
  </div>
</header>

<div class="wrap">
  <div id="app">
    <div class="state"><div class="spinner"></div>Record load ho raha hai…</div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   CONFIG — sirf yeh 3 lines badalni hain
   ════════════════════════════════════════════════════════════════ */

// Google Sheet ko File → Share → Publish to web → CSV karke jo link mile, wo yahan paste karo.
const SHEET_CSV_URL = "";

// Enquiry number jo tag par chhapa hai
const ENQUIRY_PHONE = "+91 ";

// Browse page (ei repo ka index.html)
const HERBARIUM_URL = "./";

/* ════════════════════════════════════════════════════════════════
   Demo data — SHEET_CSV_URL khali hone par ya net fail hone par chalega.
   Sheet publish karte hi isse hataya ja sakta hai.
   ════════════════════════════════════════════════════════════════ */
const DEMO_ROWS = [
  {"Tree ID":"ARN-TNT-0001","Local Name (Ho)":"Sarjoom","Common Name (Hindi)":"Sal","Scientific Name":"Shorea robusta","Family":"Dipterocarpaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0001.jpg","Tag Status":"Pending","Notes":"Saranda ka dominant canopy species"},
  {"Tree ID":"ARN-TNT-0002","Local Name (Ho)":"Madkam Daru","Common Name (Hindi)":"Mahua","Scientific Name":"Madhuca longifolia","Family":"Sapotaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0002.jpg","Tag Status":"Pending","Notes":"Wild food + NTFP; seasonal food calendar ke liye important"},
  {"Tree ID":"ARN-TNT-0003","Local Name (Ho)":"Baru Daru","Common Name (Hindi)":"Kusum","Scientific Name":"Schleichera oleosa","Family":"Sapindaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0003.jpg","Tag Status":"Pending","Notes":"Lac host tree"},
  {"Tree ID":"ARN-TNT-0004","Local Name (Ho)":"Hatna Daru","Common Name (Hindi)":"Asan / Saja","Scientific Name":"Terminalia alata","Family":"Combretaceae","Habit":"Tree","Block":"Noamundi","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0004.jpg","Tag Status":"Pending","Notes":"Lac host tree; tasar host bhi"},
  {"Tree ID":"ARN-TNT-0005","Local Name (Ho)":"Murud Daru","Common Name (Hindi)":"Palash","Scientific Name":"Butea monosperma","Family":"Fabaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0005.jpg","Tag Status":"Pending","Notes":"Lac host tree"},
  {"Tree ID":"ARN-TNT-0006","Local Name (Ho)":"Rola","Common Name (Hindi)":"Harra","Scientific Name":"Terminalia chebula","Family":"Combretaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0006.jpg","Tag Status":"Pending","Notes":"Triphala NTFP"},
  {"Tree ID":"ARN-TNT-0007","Local Name (Ho)":"Lupung Daru","Common Name (Hindi)":"Bahera","Scientific Name":"Terminalia bellirica","Family":"Combretaceae","Habit":"Tree","Block":"Noamundi","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0007.jpg","Tag Status":"Pending","Notes":"Triphala NTFP"},
  {"Tree ID":"ARN-TNT-0008","Local Name (Ho)":"Meral Daru","Common Name (Hindi)":"Amla","Scientific Name":"Phyllanthus emblica","Family":"Phyllanthaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0008.jpg","Tag Status":"Pending","Notes":"Triphala NTFP; Van Saheli value chain"},
  {"Tree ID":"ARN-TNT-0009","Local Name (Ho)":"Tarob Daru","Common Name (Hindi)":"Char / Piar","Scientific Name":"Buchanania lanzan","Family":"Anacardiaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-TNT-0009.jpg","Tag Status":"Pending","Notes":"Chironji — high value NTFP"},
  {"Tree ID":"ARN-NMD-0010","Local Name (Ho)":"Kuda Daru","Common Name (Hindi)":"Jamun","Scientific Name":"Syzygium cumini","Family":"Myrtaceae","Habit":"Tree","Block":"Tonto","Origin":"Native (wild)","Photo Link":"photos/ARN-NMD-0010.jpg","Tag Status":"Pending","Notes":"Wild food"}
];

/* ════════════════════════════════════════════════════════════════
   Neeche ka code chhedne ki zarurat nahi
   ════════════════════════════════════════════════════════════════ */

const app = document.getElementById("app");
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const clean = v => (v == null ? "" : String(v).trim());
const has = v => clean(v) !== "";

/* RFC4180 CSV parser — quoted fields, embedded commas aur newlines handle karta hai */
function parseCSV(text){
  const rows = []; let row = [], field = "", q = false;
  text = text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else q = false; }
      else field += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ row.push(field); field = ""; }
      else if (c === '\n'){ row.push(field); rows.push(row); row = []; field = ""; }
      else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

/* Header row dhoondho — sheet mein upar Base URL ki rows hain, toh "Tree ID" wali row se shuru karo */
function toObjects(rows){
  let h = rows.findIndex(r => r.some(c => clean(c).toLowerCase() === "tree id"));
  if (h === -1) h = 0;
  const keys = rows[h].map(clean);
  return rows.slice(h + 1)
    .filter(r => r.some(c => clean(c) !== ""))
    .map(r => { const o = {}; keys.forEach((k, i) => { if (k) o[k] = clean(r[i]); }); return o; });
}

function getParam(name){
  const m = new RegExp("[?&]" + name + "=([^&#]*)").exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g," ")) : "";
}

function driveImage(url){
  // Google Drive share link ko direct image link mein badlo
  const m = /drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]{20,})/.exec(url);
  return m ? "https://drive.google.com/thumbnail?id=" + m[1] + "&sz=w1000" : url;
}

function screen(title, body, showBack){
  app.innerHTML =
    '<div class="card"><div class="hero"><h1 style="font-size:22px">' + esc(title) + '</h1>' +
    '<p class="h-sub" style="font-size:15px">' + body + '</p></div></div>' +
    (showBack ? '<div class="actions"><a class="btn full" href="' + esc(HERBARIUM_URL) + '">Digital Herbarium kholo</a></div>' : "");
}

let DEMO_MODE = false;


/* Chhobi photos/ folder e thakte pare, ba repo root e. Dono try karo. */
function altPath(u){
  if (/^https?:/i.test(u)) return "";
  return u.indexOf("photos/") === 0 ? u.slice(7) : "photos/" + u;
}
function imgTag(cls, url, alt){
  const a = altPath(url);
  return '<img' + (cls ? ' class="' + cls + '"' : '') +
    ' src="' + esc(url) + '"' +
    (a ? ' data-alt="' + esc(a) + '"' : '') +
    ' alt="' + esc(alt) + '" loading="lazy"' +
    ' onerror="if(this.dataset.alt&&!this.dataset.tried){this.dataset.tried=1;this.src=this.dataset.alt;}' +
    'else{this.style.display=\'none\';}">';
}

/* Photo Link mein comma se alag karke kai photo daal sakte ho */
function gallery(raw, alt){
  const urls = clean(raw).split(",").map(u => u.trim()).filter(Boolean).map(driveImage);
  if (!urls.length) return "";
  if (urls.length === 1)
    return '<figure>' + imgTag("", urls[0], alt) + '</figure>';
  return '<figure><div class="gal" id="gal">' +
    urls.map(u => imgTag("", u, alt)).join("") +
    '</div><div class="dots" id="dots">' +
    urls.map((_, i) => '<i class="' + (i ? "" : "on") + '"></i>').join("") +
    '</div></figure>';
}

/* Is ped ka apna QR — wahi URL jo tag par chhapa hai */
function recordURL(id){
  return location.origin + location.pathname + "?id=" + encodeURIComponent(id);
}
function qrBlock(id){
  const api = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data=" +
              encodeURIComponent(recordURL(id));
  return '<div class="qr"><b>Is ped ka QR</b>' +
    '<img src="' + esc(api) + '" alt="QR ' + esc(id) + '" loading="lazy" ' +
    'onerror="this.closest(\'.qr\').style.display=\'none\'">' +
    '<br><a class="dl" href="' + esc(api) + '" download="' + esc(id) + '-qr.png" target="_blank" rel="noopener">QR download karo</a>' +
    '</div>';
}

function wireGallery(){
  const g = document.getElementById("gal"), d = document.getElementById("dots");
  if (!g || !d) return;
  g.addEventListener("scroll", () => {
    const i = Math.round(g.scrollLeft / g.clientWidth);
    [...d.children].forEach((x, n) => x.classList.toggle("on", n === i));
  }, {passive:true});
}

function demoPicker(curId){
  return '<div class="picker"><b>Demo — doosra ped dekhne ke liye tap karo</b><div class="pills">' +
    DEMO_ROWS.map(r =>
      '<a class="' + (r["Tree ID"] === curId ? "cur" : "") + '" href="?id=' +
      encodeURIComponent(r["Tree ID"]) + '">' + esc(r["Local Name (Ho)"]) + '</a>'
    ).join("") + '</div></div>';
}

function render(t, note){
  const name = clean(t["Local Name (Ho)"]) || clean(t["Common Name (Hindi)"]) || clean(t["Scientific Name"]);
  const hindi = clean(t["Common Name (Hindi)"]);
  const lat = clean(t["Latitude"]), lon = clean(t["Longitude"]);
  const photo = clean(t["Photo Link"]);
  const inat = clean(t["iNaturalist ID"]);
  const status = clean(t["Tag Status"]);

  const rows = [
    ["Kul (Family)", esc(t["Family"])],
    ["Gaon", esc(t["Village"])],
    ["Block", esc(t["Block"])],
    ["Gher (GBH)", has(t["GBH (cm)"]) ? esc(t["GBH (cm)"]) + " cm" : ""],
    ["Unchai", has(t["Height (m)"]) ? esc(t["Height (m)"]) + " m" : ""],
    ["Utpatti", esc(t["Origin"])],
    ["Tag lagne ki tareekh", esc(t["Tagging Date"])],
    ["Darj kiya", esc(t["Recorded By"])],
    ["GPS", (has(lat) && has(lon))
      ? '<a href="https://www.google.com/maps?q=' + esc(lat) + ',' + esc(lon) + '" target="_blank" rel="noopener">' + esc(lat) + ', ' + esc(lon) + '</a>' : ""],
    ["iNaturalist", has(inat)
      ? '<a href="https://www.inaturalist.org/observations/' + esc(inat) + '" target="_blank" rel="noopener">#' + esc(inat) + '</a>' : ""]
  ].filter(r => r[1] !== "");

  app.innerHTML =
    (note ? '<div class="banner">' + note + '</div>' : "") +
    '<div class="card">' +
      '<div class="hero">' +
        '<span class="idtag">' + esc(t["Tree ID"]) + '</span>' +
        '<h1>' + esc(name) + '</h1>' +
        (hindi && hindi !== name ? '<p class="h-sub">' + esc(hindi) + '</p>' : "") +
        (has(t["Scientific Name"]) ? '<p class="sci">' + esc(t["Scientific Name"]) + '</p>' : "") +
        '<div class="chips">' +
          (has(t["Habit"]) ? '<span class="chip">' + esc(t["Habit"]) + '</span>' : "") +
          (has(t["Origin"]) ? '<span class="chip">' + esc(t["Origin"]) + '</span>' : "") +
          (status ? '<span class="chip' + (/verified|tagged/i.test(status) ? " on" : "") + '">' + esc(status) + '</span>' : "") +
        '</div>' +
      '</div>' +
      gallery(photo, name) +
      '<dl>' + rows.map(r => '<div class="row"><dt>' + r[0] + '</dt><dd>' + r[1] + '</dd></div>').join("") + '</dl>' +
      (has(t["Notes"]) ? '<div class="notes"><b>Note</b>' + esc(t["Notes"]) + '</div>' : "") +
      qrBlock(clean(t["Tree ID"])) +
    '</div>' +

    '<div class="actions">' +
      ((has(lat) && has(lon))
        ? '<a class="btn primary" href="https://www.google.com/maps?q=' + esc(lat) + ',' + esc(lon) + '" target="_blank" rel="noopener">Naksha</a>'
        : "") +
      '<a class="btn' + ((has(lat) && has(lon)) ? "" : " full") + '" href="' + esc(HERBARIUM_URL) + '">Aur ped dekho</a>' +
    '</div>' +

    '<div class="report">' +
      '<b>Ped mein dikkat hai? Tag toot gaya?</b><br>' +
      'LIVE Foundation ko bataiye — Tree ID <b>' + esc(t["Tree ID"]) + '</b> ke saath.' +
      (clean(ENQUIRY_PHONE).length > 4
        ? '<br>Call / WhatsApp: <a href="tel:' + esc(ENQUIRY_PHONE.replace(/\s/g,"")) + '">' + esc(ENQUIRY_PHONE) + '</a>'
        : "") +
    '</div>' +

    (DEMO_MODE ? demoPicker(clean(t["Tree ID"])) : "") +

    '<footer>' +
      '<img class="footlogo" src="logo-full.png" data-optional data-alt="photos/logo-full.png" alt="LIVE Foundation Ranchi">' +
      'Project ARANYA · West Singhbhum, Jharkhand<br>' +
      'Reviving Native Biodiversity through Community-led In-situ Conservation</footer>';

  document.title = name + " · ARANYA";
  wireGallery();
}

function findRow(list, id){
  const key = id.trim().toLowerCase();
  return list.find(r => clean(r["Tree ID"]).toLowerCase() === key);
}

(async function(){
  const id = getParam("id");

  let list = null, note = "";

  if (!id){
    if (!SHEET_CSV_URL){
      // Preview: asli mein ?id= QR scan se aata hai
      DEMO_MODE = true;
      render(DEMO_ROWS[0], "Demo preview — asli page par Tree ID QR scan se aati hai (<b>?id=…</b>).");
    } else {
      screen("Tree ID nahi mila",
        "Yeh page kisi ped ke tag ka QR scan karne par khulta hai. Lagta hai link adhoora hai.", true);
    }
    return;
  }

  if (SHEET_CSV_URL){
    try {
      const res = await fetch(SHEET_CSV_URL, {cache: "no-store"});
      if (!res.ok) throw new Error("HTTP " + res.status);
      list = toObjects(parseCSV(await res.text()));
    } catch (e){
      list = DEMO_ROWS;
      note = "Net slow hai — purana (offline) record dikha rahe hain.";
    }
  } else {
    list = DEMO_ROWS;
    DEMO_MODE = true;
    note = "Demo mode — Sheet ka CSV link abhi <b>SHEET_CSV_URL</b> mein nahi daala gaya.";
  }

  const t = findRow(list, id);
  if (!t){
    screen("Yeh ped register mein nahi mila",
      "Tree ID <b>" + esc(id) + "</b> abhi database mein darj nahi hai. Ho sakta hai tag naya ho aur entry baaki ho.", true);
    return;
  }
  render(t, note);
})();

/* logo.png  = LIVE Foundation logo (header er dan dike)
   aranya-logo.png = ARANYA logo (paata icon er jaygay)
   Jeta repo te nei, seta nijei luke jabe. */
(function(){
  const hide = img => { img.style.display = "none"; };
  document.querySelectorAll("img[data-optional]").forEach(img => {
    img.addEventListener("error", function(){
      if (this.dataset.alt && !this.dataset.tried){ this.dataset.tried = 1; this.src = this.dataset.alt; }
      else { hide(this); const p = this.parentElement;
             if (p && p.classList.contains("mark")) p.textContent = "\u{1F33F}"; }
    });
  });
})();
</script>
